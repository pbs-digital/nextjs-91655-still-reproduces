name: Reproduce

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly, to show whether a newer canary has fixed it.
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  reproduce:
    name: next@${{ matrix.next }}, SDK from ${{ matrix.preload && '--require' || 'instrumentation.ts' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 16.4.3 is the version package.json pins; 16.1.7 is the last release before vercel/next.js#90832.
        next: ['16.4.3', '16.1.7', 'canary']
        preload: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Reproduce
        env:
          NEXT_VERSION: ${{ matrix.next }}
          PRELOAD: ${{ matrix.preload }}
        run: |
          args=()
          if [ "$NEXT_VERSION" != "16.4.3" ]; then args+=(--next "$NEXT_VERSION"); fi
          if [ "$PRELOAD" = "true" ]; then args+=(--preload); fi
          python3 scripts/reproduce.py "${args[@]}"
